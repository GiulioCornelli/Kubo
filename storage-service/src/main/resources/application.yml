spring.application.name: storage-service


server:
  port: 9010

spring:
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  config:    
    import:
      optional:file:.env[.properties] #permette di leggere i file .env

kubo:
  s3:
    endpoint: ${GARAGE_ENDPOINT}
    public-endpoint: ${GARAGE_PUBLIC_ENDPOINT:}
    region: ${GARAGE_S3_REGION}
    bucket: ${GARAGE_BUCKET}
    access-key: ${GARAGE_ACCESS_KEY_ID}
    secret-key: ${GARAGE_SECRET_ACCESS_KEY}
    presign-ttl: ${PRESIGN_TTL}
